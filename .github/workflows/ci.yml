name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  worker-smoke:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build worker (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bp-worker:smoke
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Smoke test worker screen streaming
        run: docker run --rm --user 1000 --tmpfs /workspace:rw,mode=1777 bp-worker:smoke node /opt/bp/smoke/screen-smoke.mjs
      - name: Smoke test worker console recording
        run: docker run --rm --user 1000 bp-worker:smoke node /opt/bp/smoke/console-smoke.mjs
      - name: Smoke test the no-browser MCP server of lead runs
        run: docker run --rm --user 1000 bp-worker:smoke node /opt/bp/smoke/null-mcp-smoke.mjs
      - name: Smoke test journey replays
        run: |
          docker run --rm --user 1000 bp-worker:smoke node /opt/bp/smoke/journey-lib-smoke.mjs
          docker run --rm --user 1000 --tmpfs /workspace:rw,mode=1777 bp-worker:smoke node /opt/bp/smoke/replay-smoke.mjs
      - name: Smoke test persona accessibility settings and the tool gate
        run: |
          docker run --rm --user 1000 bp-worker:smoke node /opt/bp/smoke/a11y-smoke.mjs
          docker run --rm --user 1000 --tmpfs /workspace:rw,mode=1777 bp-worker:smoke node /opt/bp/smoke/browser-smoke.mjs

  images:
    needs: [test, worker-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A build takes about 3 minutes; the director image cross-compiles, never under QEMU.
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: director
            dockerfile: Dockerfile.director
            context: .
          - image: worker
            dockerfile: worker/Dockerfile
            context: worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/boarding-party/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # boardingparty up on a fresh Ubuntu machine with no cluster: installs k3s,
  # tiny and this commit's director, then serves the board. Proves the board
  # reaches the director and that k3s enforces tiny's egress fence.
  up-k3s:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bp ./cmd/boardingparty
      - name: up
        run: |
          ./bp up --yes --no-open --port 8790 > up.log 2>&1 &
          for i in $(seq 1 120); do grep -q '^→ http' up.log && break; sleep 5; done
          cat up.log
          grep -q '^→ http' up.log
      - name: board reaches the director
        run: |
          link=$(grep -m1 '^→ http' up.log | cut -d' ' -f2)
          curl -fsSL -c jar -b jar -o /dev/null "$link"
          curl -fsS -b jar http://127.0.0.1:8790/api/runs
      - name: k3s enforces the egress fence
        # The target is a web server in another namespace: a plain pod reaches
        # it, a session pod (app=tiny-session) must not.
        run: |
          kc="kubectl --context k3s"
          $kc create namespace fence-target
          $kc -n fence-target run web --image=nginx:1.27-alpine --port=80
          $kc -n fence-target wait --for=condition=Ready pod/web --timeout=120s
          ip=$($kc -n fence-target get pod web -o jsonpath='{.status.podIP}')
          k="$kc -n boardingparty"
          probe() { # name, extra args; prints curl's exit code
            $k run "$1" --image=curlimages/curl:8.10.1 --restart=Never $2 --command -- \
              curl -s -m 5 -o /dev/null "http://$ip/" >/dev/null
            for i in $(seq 1 60); do
              case $($k get pod "$1" -o jsonpath='{.status.phase}') in Succeeded|Failed) break;; esac
              sleep 2
            done
            $k get pod "$1" -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}'
          }
          open=$(probe fence-open "")
          fenced=$(probe fence-session "--labels=app=tiny-session")
          echo "plain pod: curl exit $open; session pod: curl exit $fenced"
          $k get networkpolicy tiny-session-egress
          [ "$open" = 0 ] || { echo "plain pod could not reach $ip, the probe proves nothing"; exit 1; }
          case "$fenced" in 7|28) ;; *) echo "session pod reached $ip: the fence is not enforced"; exit 1;; esac
      - if: failure()
        run: |
          cat up.log || true
          kubectl --context k3s get pods -A -o wide || true
          kubectl --context k3s -n boardingparty describe pods || true
