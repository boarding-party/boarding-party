# Guard rails first, so nothing below (or any run pod) lands unbounded.
apiVersion: v1
kind: LimitRange
metadata:
  name: bp-defaults
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bp-quota
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
spec:
  hard:
    limits.memory: 12Gi
    requests.cpu: "4"
    limits.cpu: "8"
    pods: "12"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
rules:
  - apiGroups: ["agents.tinysystems.io"]
    resources: ["sessions"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # What tiny's pkg/session needs to materialise a session's workload.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get"]
  # The persona mailbox login (Secret bp-mailbox) is read and replaced by the admin API.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bp-mailbox"]
    verbs: ["get", "update", "delete"]
  # The Anthropic key agents run with (tiny's agent Secret) is set from the board.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tiny-agent-env"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # The project's hosts are kept on tiny's egress allow-list.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["tiny-egress-allow"]
    verbs: ["update"]
  # The one-run gate also waits for run pods to be gone.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # The egress proxy's log says which hosts a run was refused.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bp-director
subjects:
  - kind: ServiceAccount
    name: bp-director
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bp-director-data
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
spec:
  replicas: 1
  strategy:
    type: Recreate # one writer on the SQLite PVC
  selector:
    matchLabels:
      app: bp-director
  template:
    metadata:
      labels:
        app: bp-director
    spec:
      serviceAccountName: bp-director
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: director
          image: ghcr.io/boarding-party/director:main
          imagePullPolicy: Always
          args:
            - --data=/data
            - --worker-image=ghcr.io/boarding-party/worker:main
            - --director-url=http://bp-director.$(POD_NAMESPACE).svc:8080
            - --admin-addr=127.0.0.1:8081
            - --worker-addr=:8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Admin API bearer secret; created by `boardingparty setup` before this Deployment.
            - name: BP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bp-director-admin
                  key: token
            # Who may frame the board (the cloud's origin); setup never writes bp-project.
            - name: BP_FRAME_ANCESTORS
              valueFrom:
                configMapKeyRef:
                  name: bp-project
                  key: frameAncestors
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: worker
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: worker
          livenessProbe:
            httpGet:
              path: /healthz
              port: worker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bp-director-data
---
apiVersion: v1
kind: Service
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
spec:
  type: ClusterIP
  selector:
    app: bp-director
  ports:
    - name: worker
      port: 8080
      targetPort: worker
